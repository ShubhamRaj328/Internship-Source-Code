<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Clothes4U Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth-and-info-pages.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
</head>

<body class="animated-bg">

    <!-- Forgot Password Container -->
    <div class="main-container">

        <!-- Logo Section -->
        <div class="text-center mb-8 fade-in">
            <div class="logo-container mb-4">
                <div class="flex items-center space-x-3">
                    <div class="logo-icon">
                        <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Adobe%20Express%20-%20file%20%281%29-jApjl3BbI6pLPo8XO5wEXkqkMv7Sud.png"
                            alt="Clothes4U Logo" class="logo-image">
                    </div>
                    <div class="flex items-end">
                        <span class="logo-text-main text-white">Clothes4U</span>
                        <span class="logo-text-sub text-gray-300">Admin</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div
            class="form-container bg-white bg-opacity-95 backdrop-blur-lg rounded-2xl p-6 sm:p-8 shadow-2xl fade-in fade-in-delay-1">

            <!-- Form Header -->
            <div class="text-center mb-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Forgot Password</h2>
                <p class="text-gray-600">Enter your email to reset your password</p>
            </div>

            <!-- Form -->
            <form id="forgotPasswordForm" class="space-y-6">

                <!-- Email Field -->
                <div class="fade-in fade-in-delay-2">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <input type="email" id="email" name="email"
                            class="input-field w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                            placeholder="Enter your email" required>
                        <i
                            class="ph ph-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg text-sm">
                    <div class="flex items-center">
                        <i class="ph ph-warning-circle mr-2 text-lg"></i>
                        <span id="errorText">Please enter a valid email address</span>
                    </div>
                </div>

                <!-- Success Message -->
                <div id="successMessage"
                    class="hidden bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg text-sm">
                    <div class="flex items-center">
                        <i class="ph ph-check-circle mr-2 text-lg"></i>
                        <span>Password reset instructions have been sent to your email</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="submit-btn w-full py-3 px-6 text-white font-medium text-lg rounded-lg transition-all duration-300 fade-in fade-in-delay-3">
                    <span id="submitBtnText">
                        <i class="ph ph-paper-plane-right mr-2"></i>
                        Send Reset Link
                    </span>
                    <span id="submitLoader" class="hidden">
                        <i class="ph ph-spinner ph-spin mr-2"></i>
                        Sending...
                    </span>
                </button>

                <!-- Back to Login -->
                <div class="text-center fade-in fade-in-delay-3">
                    <a href="login.html"
                        class="text-primary-600 hover:text-primary-700 transition-colors flex items-center justify-center">
                        <i class="ph ph-arrow-left mr-1"></i>
                        Back to Login
                    </a>
                </div>
            </form>

        </div>

        <!-- Footer -->
        <div class="text-center mt-8 fade-in fade-in-delay-3">
            <p class="text-gray-400 text-sm flex items-center justify-center">
                <i class="ph ph-copyright mr-1"></i>
                2026 Clothes4U. All rights reserved.
            </p>
            <div class="flex items-center justify-center mt-2 space-x-4 text-gray-500">
                <a href="privacy.html" class="hover:text-white transition-colors flex items-center text-sm">
                    <i class="ph ph-shield-check mr-1"></i>
                    Privacy
                </a>
                <a href="terms.html" class="hover:text-white transition-colors flex items-center text-sm">
                    <i class="ph ph-file-text mr-1"></i>
                    Terms
                </a>
                <a href="help.html" class="hover:text-white transition-colors flex items-center text-sm">
                    <i class="ph ph-lifebuoy mr-1"></i>
                    Help
                </a>
            </div>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="notification"
        class="notification hide fixed top-4 right-4 bg-white border border-gray-200 rounded-lg shadow-lg p-4 z-50 max-w-sm">
        <div class="flex items-center">
            <div id="notificationIcon" class="mr-3"></div>
            <div>
                <p id="notificationTitle" class="font-medium text-gray-900"></p>
                <p id="notificationMessage" class="text-sm text-gray-600"></p>
            </div>
            <button id="closeNotification" class="ml-4 text-gray-400 hover:text-gray-600">
                <i class="ph ph-x"></i>
            </button>
        </div>
    </div>

    <script src="assets/js/forgot-password.js"></script>
</body>

</html>
